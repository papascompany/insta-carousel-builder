<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;background:#131316;font-family:'Pretendard Variable',sans-serif;color:#fff;overflow:hidden;position:relative;word-break:keep-all}
  .wrap{position:absolute;top:88px;bottom:88px;left:80px;right:80px;display:flex;flex-direction:column}
  .label{font-size:24px;font-weight:600;letter-spacing:0.13em;color:#CF5C3F;margin-bottom:36px}
  .head{font-size:50px;font-weight:700;line-height:1.3;letter-spacing:-0.015em}
  .acc{color:#CF5C3F}
  .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
  .card{border-radius:18px;padding:44px 40px;display:flex;align-items:center;gap:32px}
  .before{border:2px dashed rgba(255,255,255,0.3);background:rgba(255,255,255,0.03)}
  .after{background:rgba(207,92,63,0.1);border:2px solid #CF5C3F}
  .sign{flex:0 0 auto;width:72px;height:72px;border-radius:50%;position:relative}
  .sign::before,.sign::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:2px}
  .sign::before{width:30px;height:5px}
  .plus{border:2px solid rgba(255,255,255,0.5)}
  .plus::before,.plus::after{background:rgba(255,255,255,0.7)}
  .plus::after{width:5px;height:30px}
  .minus{background:#CF5C3F}
  .minus::before{background:#fff}
  .minus::after{display:none}
  .tag{font-size:24px;font-weight:700;letter-spacing:0.12em;margin-bottom:14px}
  .before .tag{color:rgba(255,255,255,0.65)}
  .after .tag{color:#CF5C3F}
  .before .txt{font-size:38px;line-height:1.5;color:rgba(255,255,255,0.7);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:rgba(255,255,255,0.55)}
  .after .txt{font-size:38px;line-height:1.5;color:#fff;font-weight:600}
  .arrow{align-self:center;width:0;height:0;margin:28px 0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:22px solid #CF5C3F}
  .caption{font-size:32px;line-height:1.45;color:rgba(255,255,255,0.65)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">BEFORE/AFTER 04</div>
    <div class="head">'잘 써줘'를 더하기보다<br/><span class="acc">하지 마</span> 한 줄을 넣는다</div>

    <div class="mid">
      <div class="card before">
        <div class="sign plus"></div>
        <div>
          <div class="tag">BEFORE · 더하는 지시</div>
          <div class="txt">"더 자연스럽게, 잘 써줘"</div>
        </div>
      </div>
      <div class="arrow"></div>
      <div class="card after">
        <div class="sign minus"></div>
        <div>
          <div class="tag">AFTER · 빼는 지시</div>
          <div class="txt">"감탄으로 문장을 시작하지 마"</div>
        </div>
      </div>
    </div>

    <div class="caption">좋게 쓰라는 말보다, 쓰지 말 것을 짚는 쪽이 AI 티를 더 빨리 지운다.</div>
  </div>
</body>
</html>
