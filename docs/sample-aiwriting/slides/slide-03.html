<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;background:#131316;font-family:'Pretendard Variable',sans-serif;color:#fff;overflow:hidden;position:relative;word-break:keep-all}
  .wrap{position:absolute;top:88px;bottom:88px;left:80px;right:80px;display:flex;flex-direction:column}
  .label{font-size:24px;font-weight:600;letter-spacing:0.13em;color:#CF5C3F;margin-bottom:36px}
  .head{font-size:50px;font-weight:700;line-height:1.3;letter-spacing:-0.015em}
  .acc{color:#CF5C3F}
  .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
  /* 채팅 말풍선 형식: 사용자가 보낸 지시문 */
  .msg{display:flex;flex-direction:column;align-items:flex-end}
  .msg + .msg{margin-top:56px}
  .tag{font-size:24px;font-weight:700;letter-spacing:0.16em;margin:0 12px 14px 0}
  .before .tag{color:rgba(255,255,255,0.65)}
  .after .tag{color:#CF5C3F}
  .bubble{max-width:800px;padding:30px 40px;border-radius:40px 40px 10px 40px;font-size:38px;line-height:1.5}
  .before .bubble{border:2px dashed rgba(255,255,255,0.3);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:rgba(255,255,255,0.55)}
  .after .bubble{background:#CF5C3F;color:#fff;font-weight:600}
  .attach{margin-top:22px;padding:20px 26px;border-radius:14px;background:rgba(19,19,22,0.28);border:2px dashed rgba(255,255,255,0.6);font-size:28px;line-height:1.45;font-weight:500;color:#fff}
  .caption{font-size:32px;line-height:1.45;color:rgba(255,255,255,0.65)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">BEFORE/AFTER 02</div>
    <div class="head">말투는 설명하지 말고<br/><span class="acc">샘플</span>로 보여 준다</div>

    <div class="mid">
      <div class="msg before">
        <div class="tag">BEFORE</div>
        <div class="bubble">"친근하게 써줘"</div>
      </div>
      <div class="msg after">
        <div class="tag">AFTER</div>
        <div class="bubble">"아래는 내가 쓴 글이야.<br/>이 말투 그대로 써줘."
          <div class="attach">[ 내가 직접 쓴 글 한 단락 붙여 넣기 ]</div>
        </div>
      </div>
    </div>

    <div class="caption">'친근하게'의 기준은 사람마다 다르고, AI는 그중 가장 흔한 쪽을 고른다.</div>
  </div>
</body>
</html>
